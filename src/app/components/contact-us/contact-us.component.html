<section class="contact-section" [style.--bg-color]="backgroundColor()" [style.--text-color]="textColor()">
    <div class="contact-container">
        <!-- Left Column: Address & Social -->
        <div class="info-column">
            <h2 class="section-title">{{ ts.t().contactUs.title }}</h2>

            <div class="address-block">
                @for (line of ts.t().contactUs.addressLines; track $index) {
                @if (line.includes('28002')) {
                <p class="address-line"><span class="easter-egg" (click)="navigateToSnake()">28002</span>{{
                    line.split('28002')[1] }}</p>
                } @else {
                <p class="address-line">{{ line }}</p>
                }
                }
            </div>

            <a [href]="linkedinUrl()" target="_blank" rel="noopener noreferrer" class="linkedin-link"
                aria-label="Visit our LinkedIn">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"
                    class="linkedin-icon">
                    <path
                        d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" />
                </svg>
            </a>
        </div>

        <!-- Right Column: static map card (no third-party embed, so no Google cookies) -->
        <div class="map-column">
            <a class="map-card" [href]="mapsLink()" target="_blank" rel="noopener noreferrer"
                [attr.aria-label]="ts.t().contactUs.openMap">
                <svg class="map-art" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
                    <rect width="600" height="400" fill="#141414" />
                    <g stroke="#262626" stroke-width="14" fill="none" stroke-linecap="round">
                        <path d="M-20 70 L620 40" /><path d="M-20 170 L620 150" /><path d="M-20 300 L620 290" />
                        <path d="M90 -20 L120 420" /><path d="M250 -20 L270 420" /><path d="M430 -20 L420 420" />
                        <path d="M520 -20 L560 420" />
                    </g>
                    <g stroke="#333" stroke-width="26" fill="none" stroke-linecap="round">
                        <path d="M-20 235 C 150 215, 380 250, 620 205" />
                        <path d="M340 -20 C 330 120, 360 260, 345 420" />
                    </g>
                    <g stroke="#1f1f1f" stroke-width="6" fill="none">
                        <path d="M170 -20 L190 420" /><path d="M-20 120 L620 95" /><path d="M-20 360 L620 350" />
                    </g>
                    <circle cx="345" cy="228" r="70" fill="#E85D04" opacity="0.08" />
                    <circle cx="345" cy="228" r="34" fill="#E85D04" opacity="0.16" />
                    <path d="M345 232 c-16 -20 -26 -32 -26 -46 a26 26 0 1 1 52 0 c0 14 -10 26 -26 46z" fill="#E85D04" />
                    <circle cx="345" cy="186" r="9" fill="#141414" />
                </svg>
                <span class="map-caption">
                    <span class="map-address">C. de Pradillo, 68 · 28002 Madrid</span>
                    <span class="map-open">{{ ts.t().contactUs.openMap }} ↗</span>
                </span>
            </a>
        </div>
    </div>
</section>
